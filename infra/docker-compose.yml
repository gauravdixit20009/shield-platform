version: '3.9'

services:
  # ─── PostgreSQL Database ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: shield_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shielddb
      POSTGRES_USER: shield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}   # From .env — NEVER hardcode
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_security.sql:/docker-entrypoint-initdb.d/01_security.sql:ro
    networks:
      - shield_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shield -d shielddb"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No external port exposed — internal only
    expose:
      - "5432"

  # ─── Redis Cache ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: shield_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    volumes:
      - redis_data:/data
    networks:
      - shield_internal
    expose:
      - "6379"

  # ─── FastAPI Backend ──────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: shield_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://shield:${POSTGRES_PASSWORD}@postgres:5432/shielddb
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY}
      - ENVIRONMENT=production
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - shield_internal
    expose:
      - "8000"
    volumes:
      - evidence_data:/app/evidence

  # ─── Ollama (Local AI — NO data leaves server) ────────────
  ollama:
    image: ollama/ollama:latest
    container_name: shield_ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - shield_internal
    expose:
      - "11434"
    # GPU support (uncomment if NVIDIA GPU available)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]

  # ─── MinIO (Encrypted Evidence Vault) ────────────────────
  minio:
    image: minio/minio:latest
    container_name: shield_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_SERVER_URL: https://files.shield.gov.in
    volumes:
      - minio_data:/data
    networks:
      - shield_internal
    expose:
      - "9000"
      - "9001"

  # ─── Next.js Frontend ─────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: shield_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=https://api.shield.gov.in
    networks:
      - shield_internal
    expose:
      - "3000"

  # ─── Nginx Reverse Proxy + WAF ────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: shield_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/modsecurity:/etc/nginx/modsecurity:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - shield_internal
      - shield_external

  # ─── Celery Worker (Background tasks) ────────────────────
  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: shield_celery
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    environment:
      - DATABASE_URL=postgresql+asyncpg://shield:${POSTGRES_PASSWORD}@postgres:5432/shielddb
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - postgres
      - redis
    networks:
      - shield_internal

  # ─── Celery Beat (Scheduled tasks) ────────────────────────
  celery_beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: shield_celery_beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://shield:${POSTGRES_PASSWORD}@postgres:5432/shielddb
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      - redis
    networks:
      - shield_internal

networks:
  shield_internal:
    driver: bridge
    internal: true    # No external internet access for internal services
  shield_external:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  ollama_models:
    driver: local
  evidence_data:
    driver: local
  nginx_logs:
    driver: local
