services:
  - type: web
    name: shield-platform-1
    env: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: ARIA_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
